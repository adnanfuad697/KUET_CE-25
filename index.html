<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KUET Civil '25 — Academic Portal</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-void: #040b14;
    --bg-deep: #060e1a;
    --bg-surface: #0a1628;
    --bg-card: #0d1e35;
    --bg-glass: rgba(13,30,53,0.7);
    --cyan: #00e5ff;
    --cyan-dim: #00b4cc;
    --cyan-glow: rgba(0,229,255,0.15);
    --orange: #ff6b1a;
    --orange-dim: #cc4a00;
    --orange-glow: rgba(255,107,26,0.15);
    --slate: #4a6080;
    --slate-light: #6b8bb0;
    --text-primary: #e8f0fe;
    --text-secondary: #8aa0c0;
    --text-muted: #4a6080;
    --border: rgba(0,229,255,0.12);
    --border-hover: rgba(0,229,255,0.3);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg-void);
    color: var(--text-primary);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Blueprint Grid Background ── */
  .blueprint-bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px),
      linear-gradient(rgba(0,229,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.015) 1px, transparent 1px);
    background-size: 80px 80px, 80px 80px, 20px 20px, 20px 20px;
  }
  .blueprint-bg::after {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 80% 50% at 50% 0%, rgba(0,229,255,0.06) 0%, transparent 70%),
                radial-gradient(ellipse 60% 40% at 80% 80%, rgba(255,107,26,0.04) 0%, transparent 60%);
  }

  /* ── Header ── */
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(4,11,20,0.92);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
  }
  .header-inner {
    max-width: 1280px; margin: 0 auto; padding: 0 24px;
    display: flex; align-items: center; justify-content: space-between; height: 64px;
  }
  .logo-block { display: flex; align-items: center; gap: 14px; }
  .logo-icon { width: 40px; height: 40px; position: relative; display: flex; align-items: center; justify-content: center; }
  .logo-icon .spin-ring { animation: spin 8s linear infinite; transform-origin: center; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .logo-text { font-family: 'Rajdhani', sans-serif; }
  .logo-text .title { font-size: 20px; font-weight: 700; color: var(--text-primary); letter-spacing: 0.05em; }
  .logo-text .sub { font-size: 11px; font-weight: 400; color: var(--cyan-dim); letter-spacing: 0.15em; text-transform: uppercase; font-family: 'JetBrains Mono', monospace; }
  .header-badge { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--cyan); border: 1px solid var(--border); padding: 4px 10px; border-radius: 4px; display: flex; align-items: center; gap: 6px; }
  .pulse-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.8)} }

  /* ── Main Layout ── */
  .main-wrap { position: relative; z-index: 1; max-width: 1280px; margin: 0 auto; padding: 32px 24px 80px; }
  .page-hero { margin-bottom: 40px; }
  .page-hero h1 { font-family: 'Rajdhani', sans-serif; font-size: clamp(28px, 4vw, 48px); font-weight: 700; line-height: 1.1; color: var(--text-primary); letter-spacing: 0.02em; }
  .page-hero h1 span { color: var(--cyan); }
  .page-hero p { margin-top: 8px; color: var(--text-secondary); font-size: 14px; font-family: 'JetBrains Mono', monospace; }

  /* ── Stats Row ── */
  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 32px; }
  .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 16px 20px; position: relative; overflow: hidden; }
  .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--cyan), transparent); opacity: 0; transition: opacity 0.3s; }
  .stat-card:hover::before { opacity: 1; }
  .stat-card .label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; font-family: 'JetBrains Mono', monospace; }
  .stat-card .value { font-family: 'Rajdhani', sans-serif; font-size: 28px; font-weight: 700; color: var(--cyan); }

  /* ── Tab Navigation ── */
  .tab-bar { display: flex; gap: 4px; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
  .tab-btn { font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 500; padding: 10px 20px; border: none; background: none; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.2s; display: flex; align-items: center; gap: 8px; border-radius: 6px 6px 0 0; }
  .tab-btn:hover { color: var(--text-secondary); background: rgba(0,229,255,0.04); }
  .tab-btn.active { color: var(--cyan); border-bottom-color: var(--cyan); }
  .tab-count { font-family: 'JetBrains Mono', monospace; font-size: 10px; background: var(--cyan-glow); color: var(--cyan); border: 1px solid rgba(0,229,255,0.2); padding: 1px 6px; border-radius: 10px; }

  /* ── Search + Actions Bar ── */
  .actions-bar { display: flex; gap: 12px; margin-bottom: 24px; align-items: center; flex-wrap: wrap; }
  .search-wrap { flex: 1; min-width: 200px; position: relative; }
  .search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); width: 16px; height: 16px; }
  .search-input { width: 100%; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px 10px 38px; color: var(--text-primary); font-family: 'Space Grotesk', sans-serif; font-size: 14px; outline: none; transition: border-color 0.2s; }
  .search-input:focus { border-color: var(--cyan-dim); }
  .search-input::placeholder { color: var(--text-muted); }
  .add-btn { display: flex; align-items: center; gap: 8px; background: var(--cyan); color: #000; font-weight: 600; font-family: 'Space Grotesk', sans-serif; font-size: 13px; border: none; border-radius: 8px; padding: 10px 18px; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
  .add-btn:hover { background: var(--cyan-dim); transform: translateY(-1px); }

  /* ── Tab Content Panels ── */
  .tab-panel { display: none; }
  .tab-panel.active { display: block; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

  /* ── Notice Cards ── */
  .notice-list { display: flex; flex-direction: column; gap: 12px; }
  .notice-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 20px 24px; display: flex; gap: 20px; align-items: flex-start; transition: border-color 0.2s, transform 0.2s; }
  .notice-card:hover { border-color: var(--border-hover); transform: translateX(3px); }
  .notice-card.urgent { border-left: 3px solid var(--orange); }
  .notice-card.normal { border-left: 3px solid var(--cyan); }
  .notice-date-block { text-align: center; min-width: 60px; font-family: 'Rajdhani', sans-serif; }
  .notice-date-block .day { font-size: 28px; font-weight: 700; color: var(--cyan); line-height: 1; }
  .notice-date-block .month { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; }
  .notice-body { flex: 1; }
  .notice-body h3 { font-size: 16px; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; }
  .notice-body p { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
  .notice-footer { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .badge { display: inline-flex; align-items: center; gap: 5px; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 4px 10px; border-radius: 4px; border: 1px solid; cursor: pointer; transition: all 0.2s; text-decoration: none; }
  .badge.pdf { color: var(--orange); border-color: rgba(255,107,26,0.3); background: rgba(255,107,26,0.08); }
  .badge.link { color: var(--cyan); border-color: rgba(0,229,255,0.3); background: rgba(0,229,255,0.08); }
  .badge.cat { color: var(--text-muted); border-color: rgba(74,96,128,0.3); background: rgba(74,96,128,0.08); }

  /* ── Resources Table ── */
  .resources-grid { display: flex; flex-direction: column; gap: 8px; }
  .resource-row { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 14px 20px; display: grid; grid-template-columns: 2fr 2fr 1fr 1fr auto; gap: 16px; align-items: center; }
  .resource-row.header-row { background: transparent; border-color: transparent; padding: 6px 20px; border-bottom: 1px solid var(--border); border-radius: 0; margin-bottom: 4px; }
  .resource-row.header-row span { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; font-family: 'JetBrains Mono', monospace; }
  .res-subject { font-size: 13px; font-weight: 600; color: var(--cyan); }
  .res-topic { font-size: 13px; color: var(--text-primary); }
  .res-date { font-size: 12px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
  .icon-btn { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; cursor: pointer; color: var(--text-secondary); font-size: 11px; display: flex; align-items: center; gap: 4px; transition: all 0.2s; }
  .icon-btn:hover { border-color: var(--cyan-dim); color: var(--cyan); }

  /* ── Family Grid ── */
  .family-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .profile-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 24px 20px; text-align: center; position: relative; overflow: hidden; transition: border-color 0.25s, transform 0.25s; }
  .profile-card:hover { border-color: var(--border-hover); transform: translateY(-4px); }
  .avatar { width: 68px; height: 68px; border-radius: 50%; background: linear-gradient(135deg, var(--bg-surface), var(--bg-void)); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; font-family: 'Rajdhani', sans-serif; font-size: 22px; font-weight: 700; color: var(--cyan); }
  .profile-name { font-size: 15px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; }
  .profile-meta { font-size: 12px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
  .merit-badge { display: inline-block; margin: 8px 0 12px; font-size: 11px; font-family: 'JetBrains Mono', monospace; padding: 3px 10px; border-radius: 4px; background: var(--orange-glow); color: var(--orange); border: 1px solid rgba(255,107,26,0.25); }
  .social-links { display: flex; gap: 8px; justify-content: center; }
  .social-btn { border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; color: var(--text-muted); font-size: 11px; font-family: 'JetBrains Mono', monospace; transition: all 0.2s; text-decoration: none; display: flex; align-items: center; gap: 4px; }
  .social-btn.fb:hover { border-color: #1877f2; color: #1877f2; background: rgba(24,119,242,0.05); }

  /* ── Modal & Toasts ── */
  .modal-overlay { position: fixed; inset: 0; z-index: 1000; background: rgba(4,11,20,0.85); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; padding: 24px 28px; transform: translateY(20px); transition: transform 0.25s; }
  .modal-overlay.open .modal { transform: translateY(0); }
  .form-group { margin-bottom: 16px; }
  .form-label { display: block; font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-family: 'JetBrains Mono', monospace; margin-bottom: 6px; }
  .form-input, .form-select, .form-textarea { width: 100%; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; color: var(--text-primary); font-size: 14px; outline: none; }
  .form-input:focus, .form-textarea:focus { border-color: var(--cyan); }
  
  /* Document View Container */
  #docViewerModal { position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; padding: 16px; }
  #docViewerModal.hidden { display: none; }

  .toast { position: fixed; bottom: 24px; right: 24px; z-index: 3000; background: var(--bg-card); border: 1px solid var(--cyan); border-radius: 10px; padding: 14px 20px; transform: translateY(100px); opacity: 0; transition: all 0.3s; }
  .toast.show { transform: translateY(0); opacity: 1; }

  .skeleton { background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-surface) 50%, var(--bg-card) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  .btn-cancel { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 10px 18px; cursor: pointer; color: var(--text-secondary); font-size: 13px; transition: all 0.2s; }
  .btn-cancel:hover { border-color: var(--slate-light); color: var(--text-primary); }
  .btn-submit { background: var(--cyan); border: none; border-radius: 8px; padding: 10px 22px; cursor: pointer; color: #000; font-weight: 600; font-size: 13px; transition: all 0.2s; }
  .btn-submit:hover { background: var(--cyan-dim); }

  @media (max-width: 768px) {
    .resource-row { grid-template-columns: 1fr; gap: 6px; }
    .resource-row.header-row { display: none; }
  }
</style>
</head>
<body>

<div class="blueprint-bg"></div>

<div class="toast" id="toast">
  <div style="font-weight:600; color:var(--cyan)" id="toast-title">Submitted!</div>
  <div style="font-size:12px; color:var(--text-secondary)" id="toast-msg">Pending admin approval before live publish.</div>
</div>

<header>
  <div class="header-inner">
    <div class="logo-block">
      <div class="logo-icon">
        <svg viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="20" r="18" stroke="rgba(0,229,255,0.2)" stroke-width="1"/>
          <circle class="spin-ring" cx="20" cy="20" r="15" stroke="#00e5ff" stroke-width="1" stroke-dasharray="4 6" opacity="0.6"/>
          <rect x="14.5" y="14.5" width="11" height="11" transform="rotate(45 20 20)" fill="none" stroke="#00e5ff" stroke-width="1.5"/>
          <circle cx="20" cy="20" r="2" fill="#00e5ff"/>
        </svg>
      </div>
      <div class="logo-text">
        <div class="title">KUET Civil '25</div>
        <div class="sub">Academic Portal · CE Batch</div>
      </div>
    </div>
    <div class="header-badge"><div class="pulse-dot"></div><span>LIVE ENGINE</span></div>
  </div>
</header>

<main class="main-wrap">
  <div class="page-hero">
    <h1>ইঞ্জিনিয়ার্স<br><span>ডেক</span></h1>
    <p>// CE '25 · Khulna University of Engineering & Technology</p>
  </div>

  <div class="stats-row">
    <div class="stat-card"><div class="label">Total Notices</div><div class="value" id="stat-notices">0</div></div>
    <div class="stat-card"><div class="label">Resources Files</div><div class="value" id="stat-resources">0</div></div>
    <div class="stat-card"><div class="label">Registered Family</div><div class="value" id="stat-family">0</div></div>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('notices')">Latest Notices <span class="tab-count" id="cnt-notices">0</span></button>
    <button class="tab-btn" onclick="switchTab('resources')">Notes & Resources <span class="tab-count" id="cnt-resources">0</span></button>
    <button class="tab-btn" onclick="switchTab('family')">Our Family <span class="tab-count" id="cnt-family">0</span></button>
  </div>

  <div class="actions-bar">
    <div class="search-wrap">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search-input" id="search-input" type="text" placeholder="Search current tab..." oninput="handleSearch(this.value)">
    </div>
    <button class="add-btn" onclick="openFormModal()">+ Add Submission</button>
  </div>

  <div id="content-area">
    <div id="panel-notices" class="tab-panel active"><div class="notice-list" id="notices-list"></div></div>
    <div id="panel-resources" class="tab-panel"><div class="resources-grid" id="resources-list"></div></div>
    <div id="panel-family" class="tab-panel"><div class="family-grid" id="family-list"></div></div>
  </div>
</main>

<div id="docViewerModal" class="hidden">
  <div class="relative w-full max-w-5xl h-[85vh] bg-slate-900 border border-cyan-500/30 rounded-2xl flex flex-col overflow-hidden">
    <div class="p-4 bg-slate-950 flex items-center justify-between border-b border-white/10">
      <h4 id="modalTitle" class="text-cyan-400 font-bold">Document Viewer</h4>
      <button onclick="closeDocViewer()" class="text-red-400 font-bold px-3 py-1 border border-red-500/30 rounded-lg hover:bg-red-500/10">✕ Close</button>
    </div>
    <iframe id="docFrame" src="" class="w-full flex-1 bg-white border-none"></iframe>
  </div>
</div>

<div class="modal-overlay" id="form-modal">
  <div class="modal">
    <div class="flex justify-between items-center border-b border-white/10 pb-4 mb-4">
      <h2 id="modal-title-text" class="text-xl font-bold text-cyan-400">Submit Data</h2>
      <button onclick="closeFormModal()" class="text-red-400 font-bold">✕</button>
    </div>
    <form id="submissionForm" onsubmit="handleFormSubmit(event)">
      <div id="dynamic-form-fields"></div>
      <div class="flex justify-end gap-3 mt-6">
        <button type="button" onclick="closeFormModal()" class="btn-cancel">Cancel</button>
        <button type="submit" class="btn-submit">Submit to Admin</button>
      </div>
    </form>
  </div>
</div>

<script>
  // ⚡ তোর নতুন সাকসেসফুল লাইভ লিঙ্ক এখানে সেট করা হলো
  const CONFIG = {
    GAS_URL: 'https://script.google.com/macros/s/AKfycbzJBXFcoKHSlPf4q-fKggOFfUyXh2XLUH8vSS9b9vurJ4ubKNx_sl-LoxEzBy8hzhOs/exec',
    DEMO_MODE: false,
  };

  let currentTab = 'notices';
  let serverData = { notices: [], resources: [], family: [] };
  let searchQuery = "";

  function getMonthShort(dateStr) {
    if(!dateStr) return "MAY";
    const months = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
    const d = new Date(dateStr);
    return isNaN(d.getTime()) ? "MAY" : months[d.getMonth()];
  }
  function getDayNum(dateStr) {
    if(!dateStr) return "25";
    const d = new Date(dateStr);
    return isNaN(d.getTime()) ? "25" : d.getDate();
  }

  function fixDriveUrl(url) {
    if (url && url.includes('drive.google.com')) {
      const matches = url.match(/\/d\/([^/]+)/);
      if (matches && matches[1]) {
        return `https://drive.google.com/file/d/${matches[1]}/preview`;
      }
    }
    return url || '#';
  }

  async function loadData() {
    showSkeletons();
    try {
      const response = await fetch(`${CONFIG.GAS_URL}?t=${new Date().getTime()}`);
      const result = await response.json();
      if(result.data) {
        serverData = result.data;
      }
    } catch (err) {
      console.log("Error loading data from sheet backend.", err);
    }
    updateUI();
  }

  function showSkeletons() {
    document.getElementById('notices-list').innerHTML = `<div class="skeleton h-24 w-full mb-3"></div><div class="skeleton h-24 w-full"></div>`;
    document.getElementById('resources-list').innerHTML = `<div class="skeleton h-12 w-full mb-2"></div><div class="skeleton h-12 w-full"></div>`;
    document.getElementById('family-list').innerHTML = `<div class="skeleton h-48 w-full"></div>`;
  }

  function updateUI() {
    document.getElementById('cnt-notices').innerText = serverData.notices.length;
    document.getElementById('cnt-resources').innerText = serverData.resources.length;
    document.getElementById('cnt-family').innerText = serverData.family.length;

    document.getElementById('stat-notices').innerText = serverData.notices.length;
    document.getElementById('stat-resources').innerText = serverData.resources.length;
    document.getElementById('stat-family').innerText = serverData.family.length;

    renderCurrentTab();
  }

  function switchTab(tabName) {
    currentTab = tabName;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    event.currentTarget.classList.add('active');
    
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.getElementById(`panel-${tabName}`).classList.add('active');
    
    renderCurrentTab();
  }

  function handleSearch(val) {
    searchQuery = val.toLowerCase();
    renderCurrentTab();
  }

  function renderCurrentTab() {
    const listData = serverData[currentTab] || [];
    const filtered = listData.filter(item => {
      const searchStr = Object.values(item).join(' ').toLowerCase();
      return searchStr.includes(searchQuery);
    });

    if (currentTab === 'notices') {
      let html = '';
      filtered.forEach(n => {
        html += `
          <div class="notice-card ${n.urgent === 'true' || n.urgent === true ? 'urgent' : 'normal'}">
            <div class="notice-date-block">
              <div class="day">${getDayNum(n.date)}</div>
              <div class="month">${getMonthShort(n.date)}</div>
            </div>
            <div class="notice-body">
              <h3>${n.title}</h3>
              <p>${n.description || ''}</p>
              <div class="notice-footer">
                <span class="badge cat">${n.category || 'Notice'}</span>
                ${n.link ? `<button onclick="openDocViewer('${n.link}', '${n.title}')" class="badge link">🔗 View Attachment</button>` : ''}
              </div>
            </div>
          </div>`;
      });
      document.getElementById('notices-list').innerHTML = html || '<p class="text-center py-6 text-gray-500">No notices found.</p>';
    } 
    
    else if (currentTab === 'resources') {
      let html = `<div class="resource-row header-row"><span>Subject</span><span>Topic</span><span>Date</span><span>Type</span><span>Actions</span></div>`;
      filtered.forEach(r => {
        html += `
          <div class="resource-row">
            <span class="res-subject">${r.subject}</span>
            <span class="res-topic">${r.topic}</span>
            <span class="res-date">${r.date || ''}</span>
            <span><span class="badge pdf">${r.type || 'PDF'}</span></span>
            <div class="res-actions">
              <button onclick="openDocViewer('${r.link}', '${r.topic}')" class="icon-btn">👁️ View</button>
            </div>
          </div>`;
      });
      document.getElementById('resources-list').innerHTML = html || '<p class="text-center py-6 text-gray-500">No notes found.</p>';
    } 
    
    else if (currentTab === 'family') {
      let html = '';
      filtered.forEach(f => {
        const initials = f.name ? f.name.split(' ').map(n => n[0]).join('').substring(0,2).toUpperCase() : 'CE';
        html += `
          <div class="profile-card">
            <div class="avatar">${initials}</div>
            <div class="profile-name">${f.name}</div>
            <div class="profile-meta">Roll: ${f.roll}</div>
            <div class="profile-meta">Merit Position: ${f.merit || 'N/A'}</div>
            <div class="merit-badge">KUET CE '25</div>
            <div class="social-links">
              ${f.fb ? `<a href="${f.fb}" target="_blank" class="social-btn fb">🌐 Facebook</a>` : ''}
            </div>
          </div>`;
      });
      document.getElementById('family-list').innerHTML = html || '<p class="text-center py-6 text-gray-500">No batchmates found.</p>';
    }
  }

  function openDocViewer(url, title) {
    const finalUrl = fixDriveUrl(url);
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('docFrame').src = finalUrl;
    document.getElementById('docViewerModal').classList.remove('hidden');
  }
  function closeDocViewer() {
    document.getElementById('docViewerModal').classList.add('hidden');
    document.getElementById('docFrame').src = '';
  }

  function openFormModal() {
    document.getElementById('modal-title-text').innerText = `Add Data to [${currentTab.toUpperCase()}]`;
    let fieldsHtml = `<input type="hidden" name="sheet" value="${currentTab}">`;
    
    if (currentTab === 'notices') {
      fieldsHtml += `
        <div class="form-group"><label class="form-label">Notice Title</label><input type="text" name="title" class="form-input" required placeholder="e.g. Class Test 1 Schedule"></div>
        <div class="form-group"><label class="form-label">Category</label><input type="text" name="category" class="form-input" placeholder="Exam, Lab, Tour etc."></div>
        <div class="form-group"><label class="form-label">Attachment Link (Drive/Web)</label><input type="url" name="link" class="form-input" placeholder="https://..."></div>
        <div class="form-group"><label class="form-label">Description</label><textarea name="description" class="form-textarea" placeholder="Detailed details..."></textarea></div>
        <div class="form-group"><label class="form-label">Date</label><input type="date" name="date" class="form-input" required></div>
        <div class="form-group"><label class="form-label">Urgent?</label><select name="urgent" class="form-select"><option value="false">No</option><option value="true">Yes (Orange Highlighting)</option></select></div>
      `;
    } else if (currentTab === 'resources') {
      fieldsHtml += `
        <div class="form-group"><label class="form-label">Subject Code / Name</label><input type="text" name="subject" class="form-input" required placeholder="e.g. CE 101"></div>
        <div class="form-group"><label class="form-label">Topic Description</label><input type="text" name="topic" class="form-input" required placeholder="e.g. Fluid Mechanics Chapter 3 Notes"></div>
        <div class="form-group"><label class="form-label">Resource Link (Drive/Web)</label><input type="url" name="link" class="form-input" required placeholder="https://..."></div>
        <div class="form-group"><label class="form-label">File Type</label><input type="text" name="type" class="form-input" placeholder="PDF, Drive Link, Doc, ZIP"></div>
        <div class="form-group"><label class="form-label">Upload Date</label><input type="date" name="date" class="form-input" required></div>
      `;
    } else if (currentTab === 'family') {
      fieldsHtml += `
        <div class="form-group"><label class="form-label">Full Name</label><input type="text" name="name" class="form-input" required placeholder="Your Name"></div>
        <div class="form-group"><label class="form-label">Roll Number</label><input type="text" name="roll" class="form-input" required placeholder="e.g. 2005045"></div>
        <div class="form-group"><label class="form-label">Merit Position</label><input type="text" name="merit" class="form-input" placeholder="e.g. 42nd"></div>
        <div class="form-group"><label class="form-label">Facebook Profile URL</label><input type="url" name="fb" class="form-input" placeholder="https://facebook.com/username"></div>
      `;
    }
    
    document.getElementById('dynamic-form-fields').innerHTML = fieldsHtml;
    document.getElementById('form-modal').classList.add('open');
  }

  function closeFormModal() {
    document.getElementById('form-modal').classList.remove('open');
    document.getElementById('submissionForm').reset();
  }

  async function handleFormSubmit(e) {
    e.preventDefault();
    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.innerText = "Submitting...";
    submitBtn.disabled = true;

    const formData = new FormData(e.target);
    const dataObj = {};
    formData.forEach((value, key) => dataObj[key] = value);
    
    dataObj['status'] = 'pending';

    try {
      // 🚀 'no-cors' মোড রিমুভ করে স্ট্যান্ডার্ড text/plain মেথডে ডাটা সাবমিট করা হলো
      await fetch(CONFIG.GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(dataObj)
      });
      
      showToast("Submission Received!", "Your post is successfully queued for Admin approval.");
    } catch (err) {
      showToast("Error Occurred", "Could not dispatch data to secure backend.");
    }

    closeFormModal();
    submitBtn.innerText = "Submit to Admin";
    submitBtn.disabled = false;
  }

  function showToast(title, msg) {
    document.getElementById('toast-title').innerText = title;
    document.getElementById('toast-msg').innerText = msg;
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 4000);
  }

  window.addEventListener('DOMContentLoaded', loadData);
</script>
</body>
</html>
